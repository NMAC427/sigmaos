syntax = "proto3";

option go_package = "sigmaos/pyenv/proto";

// Wheel represents a Python wheel package from pylock.toml
message Wheel {
  string name = 1;
  string url = 2;
  string path = 3;
  int64 size = 4;
  map<string, string> hashes = 5;
}

// PythonVersion represents a supported Python runtime
message PythonVersion {
  string version = 1;
  string python_path = 2;
  repeated string sys_tags = 3;
  map<string, string> env_markers = 4;
  string dcontainer_path = 5;
}

// InstallWheelsReq requests installation of multiple wheels and acquires locks on all of them.
// This is an atomic operation - either all locks are acquired (and missing wheels installed),
// or none are.
message InstallWheelsReq {
  repeated Wheel wheels = 1;
  string python_version = 2;  // e.g., "cpython3.11"
}

// InstallWheelsRep returns the installation result and lock handle.
// The lock_handle must be passed to ReleaseLocks to release the references.
message InstallWheelsRep {
  repeated string install_paths = 1;  // Parallel to wheels in request
  uint64 lock_handle = 2;             // Opaque handle for ReleaseLocks (0 = no handle)
  string error = 3;                   // Empty on success
}

// ReleaseLocksReq releases all locks associated with a lock handle.
message ReleaseLocksReq {
  uint64 lock_handle = 1;  // Handle returned by InstallWheels (must be > 0)
}

// ReleaseLocksRep returns the result of releasing locks.
message ReleaseLocksRep {
  string error = 1;  // Empty on success
}
